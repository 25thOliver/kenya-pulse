name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r ingestion/requirements.txt

      - name: Lint with ruff
        run: ruff check ingestion/src/ airflow/dags/ tests/

      - name: Run unit tests
        run: PYTHONPATH=ingestion/src pytest tests/ -v --tb=short
